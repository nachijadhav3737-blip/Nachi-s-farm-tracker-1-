name: Build Nachi's Farm Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          unzip -q Nachi-Farm-Tracker-Android-FIXED.zip
          ls -la
          ls -la NachisFarmTrackerAndroid

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: NachisFarmTrackerAndroid
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find NachisFarmTrackerAndroid -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nachi-Farm-Tracker-APK
          path: NachisFarmTrackerAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
